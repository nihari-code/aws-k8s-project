apiVersion: apps/v1
kind: Deployment
metadata: 
  name: aws-k8s-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aws-k8s-app
  template:
    metadata:
      labels:
        app: aws-k8s-app
    spec:
      containers:
        - name: aws-k8s-app
          image: niharidurga/aws-k8s-project:latest
          ports:
            - containerPort: 5000
